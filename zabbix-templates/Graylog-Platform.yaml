        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - var j=JSON.parse(value);var a=j.sidecars.filter(function(x){return x.node_id==="{#SCID}";});if(a.length!==1)throw "Sidecar
            missing";var s=a[0];if(!s.last_seen)throw "No heartbeat";return Math.max(0,(Date.now()-Date.parse(s.last_seen))/60000);
        tags:
