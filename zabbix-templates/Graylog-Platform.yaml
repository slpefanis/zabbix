      - uuid: ee9273dc46c842f9b5e6a9fb6d490840
        name: 'Sidecar {#SCNAME}: heartbeat age'
        type: DEPENDENT
        key: graylog.sidecar.heartbeat.age[{#SCID}]
        value_type: FLOAT
        history: 30d
        master_item:
