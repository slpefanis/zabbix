            missing";var s=a[0];if(!s.sidecar_version)throw "Version missing";return s.sidecar_version;
        tags:
        - tag: component
          value: metric
      - uuid: 8aa18faeddb54b71bd231a10d02e6c67
        name: 'Sidecar {#SCNAME}: collector detail'
        type: DEPENDENT
        key: graylog.sidecar.collector.detail[{#SCID}]
        value_type: CHAR
        history: 30d
        master_item:
          key: graylog.sidecars.raw
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - var j=JSON.parse(value);var a=j.sidecars.filter(function(x){return x.node_id==="{#SCID}";});if(a.length!==1)throw "Sidecar
            missing";var s=a[0];var st=s.node_details&&s.node_details.status||{};var bad=(st.collectors||[]).filter(function(c){return
            c.status!==0;}).map(function(c){return c.message||"Collector not running";});return (bad.length?bad.join(" | "):(st.message||"Unknown")).substring(0,250);
