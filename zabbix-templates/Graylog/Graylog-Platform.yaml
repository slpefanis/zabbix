            msgs=bad.map(function(c){return c.message||"Collector status "+c.status;});return (status+" | "+(s.node_details&&s.node_details.ip||"unknown
            IP")+" | v"+(s.sidecar_version||"?")+" | last "+ageStr(age)+" | "+bad.length+" collector issue(s)"+(msgs.length?" | "+msgs.join(";
            "):"")).substring(0,2000);
