        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - var j=JSON.parse(value);var a=j.sidecars.filter(function(x){return x.node_id==="{#SCID}";});if(a.length!==1)throw "Sidecar
            missing";var s=a[0];var st=s.node_details&&s.node_details.status||{};var cs=st.collectors||[];var bad=cs.filter(function(c){return
            c.status!==0;});var ts=Date.parse(s.last_seen||"");var age=isFinite(ts)?Math.max(0,Math.floor((Date.now()-ts)/1000)):null;function
