zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 147d70c5d37d4cf5a6904e5acddf3f1c
    name: Templates/Applications
  templates:
  - uuid: d7272a8440d744b895533be1e7bf3d92
    template: Graylog Platform by HTTP
    name: Graylog Platform by HTTP
    description: 'Single-host Graylog 7.1 API monitoring. Zabbix 7.4. Uses central HTTPS API with dedicated monitoring API token as
      HTTP Basic username and literal token as password. Set {$GRAYLOG.API.URL} and {$GRAYLOG.DATANODE.PROXY} for your deployment, and
      define {$GRAYLOG.API.TOKEN} as a secret macro on the monitored host. Do not import onto existing host without resolving conflicting
      legacy items. All thresholds conservative; raw API failures surface as unsupported items (no silent zero fallback). Sidecar per-host
      discovery is informational, aggregate failure alert only by default. All requests use Graylog API proxy, never direct OpenSearch.
      OpenSearch _cat indexes have zero replicas on some message indices: informational exposure, no replication action performed.'
    groups:
    - name: Templates/Applications
    tags:
    - tag: component
      value: graylog
    macros:
    - macro: '{$GRAYLOG.API.URL}'
      value: https://graylog.example.com/api
    - macro: '{$GRAYLOG.API.TOKEN}'
      description: Define as secret host macro. Graylog monitoring service-account API token.
    - macro: '{$GRAYLOG.DATANODE.PROXY}'
      value: graylog-datanode.example.com
      description: Data Node target for Graylog OpenSearch proxy; change to another active Data Node hostname if necessary.
    - macro: '{$GRAYLOG.APP.NODES.MIN}'
      value: '2'
    - macro: '{$GRAYLOG.DATA.NODES.MIN}'
      value: '3'
    - macro: '{$GRAYLOG.SIDECAR.OFFLINE.WARN}'
      value: '3'
    - macro: '{$GRAYLOG.SIDECAR.FAIL.WARN}'
      value: '3'
    - macro: '{$GRAYLOG.HEAP.MAX}'
      value: '85'
    - macro: '{$GRAYLOG.DISK.MAX}'
      value: '85'
    items:
    - uuid: 930c96d6522347be966ba68ebeb5f6ea
      name: 'Graylog: cluster nodes raw'
      type: HTTP_AGENT
      key: graylog.cluster.raw
      delay: 2m
      history: 1d
      value_type: TEXT
      url: '{$GRAYLOG.API.URL}/cluster'
      authtype: BASIC
      username: '{$GRAYLOG.API.TOKEN}'
      password: token
      headers:
      - name: X-Requested-By
        value: Zabbix
      - name: Accept
        value: application/json
      status_codes: '200'
      timeout: 15s
      verify_peer: 'YES'
      verify_host: 'YES'
      tags:
      - tag: component
        value: raw
      triggers:
      - uuid: 212f683b9f9b4bd69ef99c48e1859c51
        expression: nodata(/Graylog Platform by HTTP/graylog.cluster.raw,10m)=1
        name: 'Graylog: central API has stopped reporting'
        priority: HIGH
        tags:
        - tag: component
          value: graylog
    - uuid: 0229a592967a4f4aae4277372b218f07
      name: 'Graylog: input states raw'
      type: HTTP_AGENT
      key: graylog.inputs.raw
      delay: 3m
      history: 1d
      value_type: TEXT
      url: '{$GRAYLOG.API.URL}/cluster/inputstates'
      authtype: BASIC
      username: '{$GRAYLOG.API.TOKEN}'
      password: token
      headers:
      - name: X-Requested-By
        value: Zabbix
      - name: Accept
        value: application/json
      status_codes: '200'
      timeout: 15s
      verify_peer: 'YES'
      verify_host: 'YES'
      tags:
      - tag: component
        value: raw
    - uuid: 4c2bd53928c74461ac93a7239a53f116
      name: 'Graylog: all Sidecars raw'
      type: HTTP_AGENT
      key: graylog.sidecars.raw
      delay: 5m
      history: 1d
      value_type: TEXT
      url: '{$GRAYLOG.API.URL}/sidecars?page=1&per_page=200&only_active=false'
      authtype: BASIC
      username: '{$GRAYLOG.API.TOKEN}'
      password: token
      headers:
      - name: X-Requested-By
        value: Zabbix
      - name: Accept
        value: application/json
      status_codes: '200'
      timeout: 15s
      verify_peer: 'YES'
      verify_host: 'YES'
      tags:
      - tag: component
        value: raw
    - uuid: ac3ffbd19b0349acbfc4487741d1a96f
      name: 'OpenSearch: cluster health raw'
      type: HTTP_AGENT
      key: graylog.opensearch.health.raw
      delay: 2m
      history: 1d
      value_type: TEXT
      url: '{$GRAYLOG.API.URL}/datanodes/{$GRAYLOG.DATANODE.PROXY}/opensearch/_cluster/health'
      authtype: BASIC
      username: '{$GRAYLOG.API.TOKEN}'
      password: token
      headers:
      - name: X-Requested-By
        value: Zabbix
      - name: Accept
        value: application/json
      status_codes: '200'
      timeout: 15s
      verify_peer: 'YES'
      verify_host: 'YES'
      tags:
      - tag: component
        value: raw
    - uuid: 0d8b796fc4dc48d49ba7d59e217952d7
      name: 'OpenSearch: Data Node stats raw'
      type: HTTP_AGENT
      key: graylog.opensearch.nodes.raw
      delay: 3m
      history: 1d
      value_type: TEXT
      url: '{$GRAYLOG.API.URL}/datanodes/{$GRAYLOG.DATANODE.PROXY}/opensearch/_cat/nodes?format=json&h=name,ip,heap.percent,ram.percent,cpu,load_1m,disk.used_percent,node.role,master'
      authtype: BASIC
      username: '{$GRAYLOG.API.TOKEN}'
      password: token
      headers:
      - name: X-Requested-By
        value: Zabbix
      - name: Accept
        value: application/json
      status_codes: '200'
      timeout: 15s
      verify_peer: 'YES'
      verify_host: 'YES'
      tags:
      - tag: component
        value: raw
    - uuid: b1ac50fc7a2a4cc6a9cfc9104cff0fd0
      name: 'OpenSearch: indices raw'
      type: HTTP_AGENT
      key: graylog.opensearch.indices.raw
      delay: 30m
      history: 1d
      value_type: TEXT
      url: '{$GRAYLOG.API.URL}/datanodes/{$GRAYLOG.DATANODE.PROXY}/opensearch/_cat/indices?format=json&h=index,health,status,pri,rep,docs.count,store.size'
      authtype: BASIC
      username: '{$GRAYLOG.API.TOKEN}'
      password: token
      headers:
      - name: X-Requested-By
        value: Zabbix
      - name: Accept
        value: application/json
      status_codes: '200'
      timeout: 15s
      verify_peer: 'YES'
      verify_host: 'YES'
      tags:
      - tag: component
        value: raw
    - uuid: c1f171f237ec43f69ae5bcdeb1269d4c
      name: 'Graylog: throughput per node raw'
      type: HTTP_AGENT
      key: graylog.throughput.raw
      delay: 2m
      history: 1d
      value_type: TEXT
      url: '{$GRAYLOG.API.URL}/cluster/metrics/multiple'
      authtype: BASIC
      username: '{$GRAYLOG.API.TOKEN}'
      password: token
      headers:
      - name: X-Requested-By
        value: Zabbix
      - name: Accept
        value: application/json
      - name: Content-Type
        value: application/json
      status_codes: '200'
      timeout: 15s
      verify_peer: 'YES'
      verify_host: 'YES'
      tags:
      - tag: component
        value: raw
      request_method: POST
      post_type: JSON
      posts: '{"metrics":["org.graylog2.throughput.input.1-sec-rate","org.graylog2.throughput.output.1-sec-rate"]}'
    - uuid: d112b2ac0db44fc7978634a41a6bba26
      name: 'Graylog: cumulative traffic counters raw'
      type: HTTP_AGENT
      key: graylog.traffic.raw
      delay: 2m
      history: 1d
      value_type: TEXT
      url: '{$GRAYLOG.API.URL}/cluster/metrics/multiple'
      authtype: BASIC
      username: '{$GRAYLOG.API.TOKEN}'
      password: token
      headers:
      - name: X-Requested-By
        value: Zabbix
      - name: Accept
        value: application/json
      - name: Content-Type
        value: application/json
      status_codes: '200'
      timeout: 15s
      verify_peer: 'YES'
      verify_host: 'YES'
      tags:
      - tag: component
        value: raw
      request_method: POST
      post_type: JSON
      posts: '{"metrics":["org.graylog2.traffic.input","org.graylog2.traffic.output"]}'
    - uuid: 1b45b1e25b4740d68eb358d9845d3369
      name: 'Graylog: application nodes seen'
      type: DEPENDENT
      key: graylog.cluster.count
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: graylog.cluster.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);return Object.keys(j).length;
      tags:
      - tag: component
        value: metric
      triggers:
      - uuid: 1a45f2ba3ec24d4182d152600b9867dc
        expression: max(/Graylog Platform by HTTP/graylog.cluster.count,10m)<{$GRAYLOG.APP.NODES.MIN}
        name: 'Graylog: application node count below expected'
        priority: HIGH
        tags:
        - tag: component
          value: graylog
    - uuid: aaf119b42a7a440f99ce39287cb8a8af
      name: 'Graylog: healthy application nodes'
      type: DEPENDENT
      key: graylog.cluster.healthy
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: graylog.cluster.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);return Object.keys(j).filter(function(k){var n=j[k];return n.lifecycle==="running"&&n.lb_status==="alive"&&n.is_processing===true;}).length;
      tags:
      - tag: component
        value: metric
    - uuid: e613449ca82f40bd9a523b91e64329dc
      name: 'OpenSearch: cluster status'
      type: DEPENDENT
      key: graylog.os.status
      value_type: CHAR
      history: 30d
      master_item:
        key: graylog.opensearch.health.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);var v=j.status; if(v===undefined||v===null) throw "Missing field"; return v;
      tags:
      - tag: component
        value: metric
      triggers:
      - uuid: 53ec389a3d7741b3a45945977a0cd3a8
        expression: count(/Graylog Platform by HTTP/graylog.os.status,#3,"eq","red")>=3
        name: 'OpenSearch: cluster RED'
        priority: HIGH
        tags:
        - tag: component
          value: graylog
    - uuid: afa089d7ccc5443c969ca31ca9bab029
      name: 'OpenSearch: Data Nodes online'
      type: DEPENDENT
      key: graylog.os.nodes
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: graylog.opensearch.health.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);var v=j.number_of_data_nodes; if(v===undefined||v===null) throw "Missing field"; return v;
      tags:
      - tag: component
        value: metric
      triggers:
      - uuid: 3ffc35ec80e642e281f97580ddad2756
        expression: max(/Graylog Platform by HTTP/graylog.os.nodes,10m)<{$GRAYLOG.DATA.NODES.MIN}
        name: 'OpenSearch: fewer than expected Data Nodes'
        priority: HIGH
        tags:
        - tag: component
          value: graylog
    - uuid: 75491f7757be4bc9b89d0bca9daacaba
      name: 'OpenSearch: unassigned shards'
      type: DEPENDENT
      key: graylog.os.unassigned
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: graylog.opensearch.health.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);var v=j.unassigned_shards; if(v===undefined||v===null) throw "Missing field"; return v;
      tags:
      - tag: component
        value: metric
      triggers:
      - uuid: 18307a04348c487dbf6e3763148f7356
        expression: min(/Graylog Platform by HTTP/graylog.os.unassigned,15m)>0
        name: 'OpenSearch: unassigned shards sustained'
        priority: AVERAGE
        tags:
        - tag: component
          value: graylog
    - uuid: 9a4dee767cb44f24870534667fbd34bd
      name: 'OpenSearch: pending tasks'
      type: DEPENDENT
      key: graylog.os.pending
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: graylog.opensearch.health.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);var v=j.number_of_pending_tasks; if(v===undefined||v===null) throw "Missing field"; return v;
      tags:
      - tag: component
        value: metric
      triggers:
      - uuid: 1ad4f1f97cb74c49894402868907a240
        expression: min(/Graylog Platform by HTTP/graylog.os.pending,15m)>25
        name: 'OpenSearch: pending tasks sustained'
        priority: WARNING
        tags:
        - tag: component
          value: graylog
    - uuid: b172f850c4ae4779887fe3f06a03fad2
      name: 'OpenSearch: active shards percent'
      type: DEPENDENT
      key: graylog.os.activepct
      value_type: FLOAT
      history: 30d
      master_item:
        key: graylog.opensearch.health.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);var v=j.active_shards_percent_as_number; if(v===undefined||v===null) throw "Missing field"; return
          v;
      tags:
      - tag: component
        value: metric
      units: '%'
    - uuid: 81831c716bb94a2ba01564b712fd7f2a
      name: 'Sidecars: registered'
      type: DEPENDENT
      key: graylog.sidecars.total
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: graylog.sidecars.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);if(j.sidecars.length!==j.total) throw "Sidecar pagination incomplete";return j.total;
      tags:
      - tag: component
        value: metric
    - uuid: 5ed35bf4cb2e49498d51c5ce4e75e916
      name: 'Sidecars: active'
      type: DEPENDENT
      key: graylog.sidecars.active
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: graylog.sidecars.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);if(j.sidecars.length!==j.total) throw "Sidecar pagination incomplete";return j.sidecars.filter(function(s){return
          s.active===true}).length;
      tags:
      - tag: component
        value: metric
    - uuid: 4d5f23bdfa3e454b8d94a893ddb78364
      name: 'Sidecars: offline'
      type: DEPENDENT
      key: graylog.sidecars.offline
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: graylog.sidecars.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);if(j.sidecars.length!==j.total) throw "Sidecar pagination incomplete";return j.sidecars.filter(function(s){return
          s.active===false}).length;
      tags:
      - tag: component
        value: metric
      triggers:
      - uuid: 22a80241f01f4074b864493eddb78d7c
        expression: min(/Graylog Platform by HTTP/graylog.sidecars.offline,15m)>={$GRAYLOG.SIDECAR.OFFLINE.WARN}
        name: 'Graylog: multiple Sidecars offline'
        priority: WARNING
        tags:
        - tag: component
          value: graylog
    - uuid: ef469eb182914923a33bf64305112456
      name: 'Sidecars: collectors failing (hosts)'
      type: DEPENDENT
      key: graylog.sidecars.failing
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: graylog.sidecars.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);if(j.sidecars.length!==j.total) throw "Sidecar pagination incomplete";return j.sidecars.filter(function(s){return
          (s.node_details&&s.node_details.status&&s.node_details.status.collectors||[]).some(function(c){return c.status===2;});}).length;
      tags:
      - tag: component
        value: metric
      triggers:
      - uuid: 6fa84884ec8b466e80fd1ee632fe5009
        expression: min(/Graylog Platform by HTTP/graylog.sidecars.failing,15m)>={$GRAYLOG.SIDECAR.FAIL.WARN}
        name: 'Graylog: multiple Sidecar collectors failing'
        priority: WARNING
        tags:
        - tag: component
          value: graylog
    - uuid: 4bd5162baf864a67bbd4a36d08078d34
      name: 'Sidecars: collectors stopped (hosts)'
      type: DEPENDENT
      key: graylog.sidecars.stopped
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: graylog.sidecars.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);if(j.sidecars.length!==j.total) throw "Sidecar pagination incomplete";return j.sidecars.filter(function(s){return
          (s.node_details&&s.node_details.status&&s.node_details.status.collectors||[]).some(function(c){return c.status===1;});}).length;
      tags:
      - tag: component
        value: metric
    - uuid: c12a9e875e554ee1bfadc55e2eccd0f7
      name: 'OpenSearch: total indices'
      type: DEPENDENT
      key: graylog.indices.count
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: graylog.opensearch.indices.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);return j.length;
      tags:
      - tag: component
        value: metric
    - uuid: a69c75ebf05144e7b11eeb2c71e9f308
      name: 'OpenSearch: indices not green'
      type: DEPENDENT
      key: graylog.indices.notgreen
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: graylog.opensearch.indices.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);return j.filter(function(x){return x.health!=="green";}).length;
      tags:
      - tag: component
        value: metric
      triggers:
      - uuid: 10dd6a1a48cd4fc8886a1c01f22433a5
        expression: min(/Graylog Platform by HTTP/graylog.indices.notgreen,30m)>0
        name: 'OpenSearch: non-green indices for 30 minutes'
        priority: WARNING
        tags:
        - tag: component
          value: graylog
    - uuid: f03fb1c326264394baf5cec24d335c59
      name: 'OpenSearch: message indices'
      type: DEPENDENT
      key: graylog.indices.message.count
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: graylog.opensearch.indices.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);return j.filter(function(x){return /^graylog_/.test(x.index);}).length;
      tags:
      - tag: component
        value: metric
    - uuid: 8f667148d73045c6b90016c5eba7fe10
      name: 'OpenSearch: message indices without replicas'
      type: DEPENDENT
      key: graylog.indices.message.noreplica
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: graylog.opensearch.indices.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);return j.filter(function(x){return /^graylog_/.test(x.index)&&Number(x.rep)===0;}).length;
      tags:
      - tag: component
        value: metric
    - uuid: 340676abccca42d287ea6003f7f135b1
      name: 'Graylog: cluster incoming messages per second'
      type: DEPENDENT
      key: graylog.throughput.cluster.input
      value_type: FLOAT
      history: 30d
      master_item:
        key: graylog.throughput.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);var keys=Object.keys(j);if(!keys.length)throw "No nodes";var sum=0;keys.forEach(function(k){var a=j[k].metrics.filter(function(m){return
          m.full_name==="org.graylog2.throughput.input.1-sec-rate";});if(a.length!==1||typeof a[0].metric.value!=="number")throw "Missing
          input rate for "+k;sum+=a[0].metric.value;});return sum;
      tags:
      - tag: component
        value: metric
      units: msg/s
    - uuid: d98e45dc6df941af9a3e4e92b0f0457f
      name: 'Graylog: cluster outgoing messages per second'
      type: DEPENDENT
      key: graylog.throughput.cluster.output
      value_type: FLOAT
      history: 30d
      master_item:
        key: graylog.throughput.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var j=JSON.parse(value);var keys=Object.keys(j);if(!keys.length)throw "No nodes";var sum=0;keys.forEach(function(k){var a=j[k].metrics.filter(function(m){return
          m.full_name==="org.graylog2.throughput.output.1-sec-rate";});if(a.length!==1||typeof a[0].metric.value!=="number")throw "Missing
          output rate for "+k;sum+=a[0].metric.value;});return sum;
      tags:
      - tag: component
        value: metric
      units: msg/s
    - uuid: 4fb62ce9bea04bf5a26acadfff8318bb
      name: 'OpenSearch: Graylog message indices storage'
      type: DEPENDENT
      key: graylog.indices.message.bytes
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: graylog.opensearch.indices.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var a=JSON.parse(value);var units={b:1,kb:1024,mb:1048576,gb:1073741824,tb:1099511627776,pb:1125899906842624};var sum=0;a.forEach(function(x){if(!/^graylog_/.test(x.index))return;var
          m=String(x["store.size"]).toLowerCase().match(/^([0-9.]+)(b|kb|mb|gb|tb|pb)$/);if(!m)throw "Unrecognised size for "+x.index;sum+=Number(m[1])*units[m[2]];});return
          Math.round(sum);
      tags:
      - tag: component
        value: metric
      units: B
    - uuid: e00c4302c53249e4b594efed2833cd02
      name: 'Graylog: Sidecar diagnostics HTML report'
      type: DEPENDENT
      key: graylog.sidecars.report.html
      history: 1d
      value_type: TEXT
      description: Single HTML snapshot of all Sidecars, sorted by offline, collector failures, stopped, then healthy. Output is limited
        to avoid oversized text item values.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var data = JSON.parse(value);\nif (!data.sidecars || !Array.isArray(data.sidecars)) throw 'Missing Sidecar array';\nif (typeof\
          \ data.total === 'number' && data.sidecars.length !== data.total) throw 'Incomplete Sidecar page: ' + data.sidecars.length\
          \ + '/' + data.total;\nvar now = Date.now();\nfunction esc(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"\
          /g,'&quot;').replace(/'/g,'&#39;'); }\nfunction duration(ms) {\n  if (!isFinite(ms) || ms < 0) return 'unknown';\n  var sec\
          \ = Math.floor(ms/1000);\n  if (sec < 60) return sec + 's';\n  var m = Math.floor(sec/60); if (m < 60) return m + 'm';\n \
          \ var h = Math.floor(m/60); if (h < 24) return h + 'h ' + (m%60) + 'm';\n  return Math.floor(h/24) + 'd ' + (h%24) + 'h';\n\
          }\nvar rows = data.sidecars.map(function(s) {\n  var details = s.node_details || {};\n  var st = details.status || {};\n \
          \ var c = st.collectors || [];\n  var failures = c.filter(function(x){return Number(x.status)===2;});\n  var stopped = c.filter(function(x){return\
          \ Number(x.status)===1;});\n  var running = c.filter(function(x){return Number(x.status)===0;}).length;\n  var last = s.last_seen\
          \ ? Date.parse(s.last_seen) : NaN;\n  var age = isFinite(last) ? Math.max(0,now-last) : Infinity;\n  var state = !s.active\
          \ ? 'OFFLINE' : failures.length ? 'FAILING' : stopped.length ? 'STOPPED' : 'HEALTHY';\n  var rank = state==='OFFLINE' ? 0\
          \ : state==='FAILING' ? 1 : state==='STOPPED' ? 2 : 3;\n  var messages = c.filter(function(x){return Number(x.status)!==0;}).map(function(x){return\
          \ x.message || x.verbose_message || 'Collector issue';});\n  if (!messages.length && rank<3 && st.message) messages=[st.message];\n\
          \  var detail = messages.join('; ');\n  if (detail.length>140) detail=detail.slice(0,137)+'...';\n  var collectorText = running\
          \ + ' running';\n  if (failures.length) collectorText += ', ' + failures.length + ' failing';\n  if (stopped.length) collectorText\
          \ += ', ' + stopped.length + ' stopped';\n  if (!c.length) collectorText = 'No collectors reported';\n  return {rank:rank,age:age,name:s.node_name||s.node_id||'unknown',ip:details.ip||'',version:s.sidecar_version||'',state:state,collectorText:collectorText,detail:detail};\n\
          });\nrows.sort(function(a,b){return a.rank-b.rank || b.age-a.age || a.name.localeCompare(b.name);});\nvar offline=rows.filter(function(x){return\
          \ x.rank===0;}).length;\nvar failing=rows.filter(function(x){return x.rank===1;}).length;\nvar stopped=rows.filter(function(x){return\
          \ x.rank===2;}).length;\nvar h=['<div style=\"font-family:Arial,sans-serif;font-size:12px;color:#e5e7eb;background-color:#202328\"\
          >',\n'<div style=\"padding:8px 10px;color:#e5e7eb;background-color:#202328\"><b>Sidecars: '+rows.length+'</b> &nbsp; | &nbsp;\
          \ <span style=\"color:#fca5a5\">Offline: '+offline+'</span> &nbsp; | &nbsp; <span style=\"color:#fdba74\">Failing: '+failing+'</span>\
          \ &nbsp; | &nbsp; Stopped: '+stopped+'</div>',\n'<table style=\"width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px;color:#e5e7eb;background-color:#262a30\"\
          \ border=\"1\" cellpadding=\"5\" cellspacing=\"0\">',\n'<thead><tr style=\"background-color:#303743;color:#ffffff\"><th width=\"\
          18%\" align=\"left\">Sidecar</th><th width=\"9%\" align=\"left\">Status</th><th width=\"11%\" align=\"left\">IP address</th><th\
          \ width=\"7%\" align=\"left\">Version</th><th width=\"9%\" align=\"left\">Last seen</th><th width=\"13%\" align=\"left\">Collectors</th><th\
          \ width=\"33%\" align=\"left\">Problem / error</th></tr></thead><tbody>'];\nrows.forEach(function(r){\n  var bg=r.rank===0?'#48272e':r.rank===1?'#473323':r.rank===2?'#423b28':'#262a30';\n\
          \  var accent=r.rank===0?'#fca5a5':r.rank===1?'#fdba74':r.rank===2?'#fde68a':'#86efac';\n  var style=' style=\"background-color:'+bg+';color:#f8fafc\"\
          ';\n  h.push('<tr'+style+'><td style=\"color:#f8fafc\">'+esc(r.name)+'</td><td><b style=\"color:'+accent+'\">'+r.state+'</b></td><td>'+esc(r.ip)+'</td><td>'+esc(r.version)+'</td><td>'+duration(r.age)+'</td><td>'+esc(r.collectorText)+'</td><td>'+esc(r.detail)+'</td></tr>');\n\
          });\nh.push('</tbody></table></div>');\nvar html=h.join('');\nif (html.length>60000) throw 'Sidecar report exceeds 60k characters:\
          \ '+html.length;\nreturn html;"
      master_item:
        key: graylog.sidecars.raw
      tags:
      - tag: component
        value: sidecar
